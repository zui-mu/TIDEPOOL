name: TidePool CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  repository:
    name: Repository rules
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: node --test scripts/ci/check-repository.test.mjs
      - run: node scripts/ci/check-repository.mjs

  unity:
    name: Unity compilation and regressions
    needs: repository
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check Unity licensing configuration
        shell: pwsh
        env:
          HAS_LICENSE: ${{ secrets.UNITY_SERIAL != '' || secrets.UNITY_LICENSE != '' }}
          HAS_ACCOUNT: ${{ secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
        run: |
          if ($env:HAS_LICENSE -ne 'true' -or $env:HAS_ACCOUNT -ne 'true') {
            throw 'Unity requires UNITY_EMAIL, UNITY_PASSWORD and UNITY_SERIAL or a compatible UNITY_LICENSE in Actions secrets. See docs/testing.md.'
          }
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Install the project editor
        shell: pwsh
        run: |
          $settings = Get-Content TidePool/ProjectSettings/ProjectVersion.txt -Raw
          if ($settings -notmatch '(?m)^m_EditorVersionWithRevision: ([0-9]+\.[0-9]+\.[0-9]+[a-z][0-9]+) \(([0-9a-f]{12})\)\s*$') {
            throw 'Invalid Unity version and revision in ProjectVersion.txt'
          }
          $version, $revision = $Matches[1], $Matches[2]
          $installer = Join-Path $env:RUNNER_TEMP 'UnitySetup.exe'
          curl.exe --fail --silent --show-error --location --retry 3 --output $installer "https://download.unity3d.com/download_unity/$revision/Windows64EditorInstaller/UnitySetup64-$version.exe"
          if ($LASTEXITCODE) { throw 'Could not download the Unity Editor' }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Unity Technologies') {
            throw 'Invalid Unity installer signature'
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'UnityEditor'
          $result = Start-Process -FilePath $installer -ArgumentList '/S',"/D=$installDir" -NoNewWindow -Wait -PassThru
          $editor = Join-Path $installDir 'Editor/Unity.exe'
          if ($result.ExitCode -ne 0 -or !(Test-Path -LiteralPath $editor)) { throw 'Unity installation failed' }
          Remove-Item -LiteralPath $installer
          "UNITY_EDITOR=$editor" >> $env:GITHUB_ENV
      - name: Activate Unity
        id: license
        shell: pwsh
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: node scripts/ci/unity-license.mjs activate
      - name: Compile and run math, character and water checks
        run: node scripts/ci/run-unity.mjs
      - name: Return Unity seat
        if: always() && steps.license.outcome == 'success'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: node scripts/ci/unity-license.mjs return
      - name: Upload Unity test evidence
        if: always() && steps.license.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unity-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: TidePool/Logs/ci/
          retention-days: 7
          if-no-files-found: warn
